<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="5.6666667 6.1666667 36.6666667 36.6666667" fill="none"><title>Non-Steam Launcher — Colección</title><desc>Blue game library cover with graphite binding, cyan second cover and white controller buttons. Transparent exterior.</desc><defs><linearGradient id="cyan" x1="14" y1="8" x2="40" y2="39" gradientUnits="userSpaceOnUse"><stop stop-color="#24D0E9"/><stop offset="1" stop-color="#08AFDA"/></linearGradient><linearGradient id="blue" x1="15" y1="9" x2="38" y2="41" gradientUnits="userSpaceOnUse"><stop stop-color="#0FA9EB"/><stop offset="1" stop-color="#0663DB"/></linearGradient><linearGradient id="graphite" x1="8" y1="9" x2="15" y2="41" gradientUnits="userSpaceOnUse"><stop stop-color="#48525E"/><stop offset="1" stop-color="#303A47"/></linearGradient><clipPath id="front-outline"><rect x="8" y="9" width="31" height="32" rx="3"/></clipPath><filter id="button-shadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="0.34" result="blur"/><feOffset in="blur" dy="0.75" result="offset"/><feFlood flood-color="#34383D" flood-opacity="0.65" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="second-cover"><rect x="12.5" y="8" width="27.5" height="32" rx="3" fill="url(#cyan)"/></g><g id="main-cover" clip-path="url(#front-outline)"><path d="M8 9h31v32H8z" fill="url(#blue)"/><path id="graphite-binding" d="M8 9h6.4v32H8z" fill="url(#graphite)"/></g><g id="controller-buttons" transform="translate(0 -1.3)" filter="url(#button-shadow)" fill="#FFF"><path id="directional-pad" d="M21 21.3h1.8a.7.7 0 0 1 .7.7v2.4h2.4a.7.7 0 0 1 .7.7v1.8a.7.7 0 0 1-.7.7h-2.4V30a.7.7 0 0 1-.7.7H21a.7.7 0 0 1-.7-.7v-2.4h-2.4a.7.7 0 0 1-.7-.7v-1.8a.7.7 0 0 1 .7-.7h2.4V22a.7.7 0 0 1 .7-.7Z"/><circle id="upper-button" cx="33.7" cy="23.